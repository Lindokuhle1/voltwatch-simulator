services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: voltwatch
      POSTGRES_USER: voltwatch
      POSTGRES_PASSWORD: voltwatch
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voltwatch -d voltwatch"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
